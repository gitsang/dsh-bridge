# dsh-bridge bundle patch.
#
# Adds one Host row. The row registers the authenticated /api/pi-bridge
# routes and owns the Pi RPC child-process attachments. The browser half is
# discovered from package.json dsh.client and registers a sidebar panel.
- insert:
    - id: pi-bridge
      name: '@gitsang/dsh-bridge'
      inject: [connection]
